<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 14 — Cafe Strega · Counterside MMM</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>

  <!-- Sticky Reader Header -->
  <header class="reader-header">
    <a href="index.html" class="back-btn">&#8592; All Chapters</a>

    <div class="reader-title-wrap">
      <div class="reader-series">Counterside — MMM</div>
      <div class="reader-chapter">Chapter 14 · Cafe Strega</div>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <span id="themeIcon">🌙</span>
      <span id="themeLabel">Dark</span>
    </button>

    <a href="Chapter_15.html" class="reader-nav-btn">Next &#8594;</a>
  </header>

  <!-- Comic Strip -->
  <main class="comic-strip" id="comicStrip">
    <!-- Pages loaded dynamically -->
  </main>

  <!-- Bottom Navigation -->
  <footer class="reader-footer">
    <a href="Chapter_13.html" class="reader-nav-btn">&#8592; Prev Chapter</a>
    <span class="footer-label">Chapter 14 of 20</span>
    <a href="Chapter_15.html" class="reader-nav-btn">Next Chapter &#8594;</a>
  </footer>

  <script src="theme.js"></script>
  <script>
    // Dynamically load pages — tries 14-1, 14-2 ... until image fails
    (function() {
      const strip = document.getElementById('comicStrip');
      const folder = "MMM - [14] Cafe Strega";
      const ext = "png";
      let page = 1;
      const MAX = 80;

      function loadNext() {
        if (page > MAX) return;
        const img = new Image();
        const src = folder + "/" + "TLED_" + page + "." + ext;
        img.onload = function() {
          img.alt = "Page " + page;
          img.className = "";
          strip.appendChild(img);
          page++;
          loadNext();
        };
        img.onerror = function() {
          // done
        };
        img.src = src;
      }

      loadNext();
    })();
  </script>

</body>
</html>
