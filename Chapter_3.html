  <script src="theme.js"></script>
  <script>
    // Dynamically load pages — tries 3-1, 3-2 ... until image fails
    (function() {
      const strip = document.getElementById('comicStrip');
      const folder = "MMM - [3] 100 Days Cleaning";
      const ext = "jpg";
      let page = 1;
      const MAX = 80;

      function loadNext() {
        if (page > MAX) return;
        const img = new Image();
        const src = folder + "/" + 3 + "-" + page + "." + ext;
        img.onload = function() {
          img.alt = "Page " + page;
          img.className = "";
          strip.appendChild(img);
          page++;
          loadNext();
        };
        img.onerror = function() {
          // done
        };
        img.src = src;
      }

      loadNext();
    })();
  </script>
